name: Generate explicitly acknowledged non-commercial Edge TTS auditions (not production)

on:
  push:
    branches: [main]
    paths:
      - "content/narration-master-short-001-and-002.md"
      - "scripts/generate-narration.py"
      - "scripts/generate-queue-package.py"
      - "scripts/render-queued-draft.py"
      - "scripts/render-thumbnail.mjs"
      - "scripts/render-photo-thumbnail.py"
      - ".github/workflows/free-narration-artifact.yml"
  workflow_dispatch:
    inputs:
      short:
        description: Narration to audition
        required: true
        type: choice
        options:
          - both
          - short-001
          - short-002
        default: both
      allow_noncommercial_audition:
        description: Confirm this is an internal audition only; this voice is not Roderic and is not commercially cleared.
        required: true
        type: boolean
        default: false
  schedule:
    # Scheduled on main only; the job-level manual-acknowledgement guard skips scheduled runs.
    - cron: "0 15 * * 6"

permissions:
  contents: read

concurrency:
  group: sonicvhibez-short-narration
  cancel-in-progress: false

jobs:
  generate-audio:
    if: false # Disabled: Roderic is the exclusive owner-approved narrator; Edge TTS is not authorized for audition or production.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require explicit non-commercial audition acknowledgement
        env:
          ALLOW_NONCOMMERCIAL_AUDITION: ${{ inputs.allow_noncommercial_audition }}
        run: |
          if [ "$ALLOW_NONCOMMERCIAL_AUDITION" != "true" ]; then
            echo "::error::Blocked. Edge TTS is not the approved Roderic voice and is not commercially cleared."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install narration tools only
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            timeout 180s sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          command -v ffprobe
          python -m pip install --disable-pip-version-check --retries 3 --timeout 30 edge-tts mutagen
      - name: Validate the replenishable queue and destination safety
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q = json.loads(Path("content/queue.json").read_text(encoding="utf-8"))
          items = q.get("items", [])
          cadence = q.get("cadence", {})
          plan = json.loads(Path("config/weekly-content-plan.json").read_text(encoding="utf-8"))
          cycle = plan.get("publicationCycle", {})
          fallback = cadence.get("draftPreparationFallback", {})
          formats = ["long_form", "long_form", "short"]
          spacing = plan.get("minimumPublicationSpacingHours")
          cycle_hours = spacing * len(formats) if isinstance(spacing, (int, float)) else None
          assert q.get("publishingEnabled") is False, "Public publishing must remain disabled"
          assert cadence.get("timezone") == "Africa/Johannesburg"
          assert plan.get("timezone") == cadence.get("timezone")
          assert cadence.get("formats") == formats and cycle.get("formats") == formats
          assert isinstance(spacing, (int, float)) and spacing >= 72, "Actual publications must remain at least 72 elapsed hours apart"
          assert cadence.get("minimumHoursBetweenConsecutivePublications") == spacing
          assert cycle.get("minimumHoursBetweenConsecutivePublications") == spacing
          assert cadence.get("minimumCycleHours") == cycle_hours == 216
          assert cycle.get("minimumCycleHours") == cycle_hours
          assert cycle.get("publicationRequiresVerifiedHistory") is True
          assert cycle.get("publicationEnabled") is False and plan.get("publishingEnabled") is False
          assert fallback.get("status") == "DRAFT_ONLY" and fallback.get("notPublicationCadence") is True
          assert "postsPerWeek" not in cadence
          assert len(items) >= 10
          ids = [x.get("id") for x in items]
          assert all(isinstance(i, str) and i.strip() for i in ids)
          assert len(ids) == len(set(ids))
          approved = "https://selar.com/0u19v8u99l"
          assert all(x.get("productUrl") == approved for x in items)
          print(f"PASS: {len(items)} queue topics; approved Selar URL only; verified-history gate and 72-hour spacing policy retained; publication disabled.")
          PY
      - name: Validate Python generators
        run: python -m py_compile scripts/generate-narration.py scripts/generate-queue-package.py
      - name: Validate narration extraction
        run: python scripts/generate-narration.py --short both --extract-only
      - name: Generate non-commercial internal narration audition
        env:
          SELECTED_SHORT: ${{ github.event.inputs.short || 'both' }}
        run: python scripts/generate-narration.py --short "$SELECTED_SHORT" --voice en-US-GuyNeural --rate=-10% --allow-noncommercial-audition
      - name: Generate the next non-commercial internal queue audition package
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: python scripts/generate-queue-package.py --run-number "$RUN_NUMBER" --voice en-US-GuyNeural --rate=-10% --allow-noncommercial-audition
      - name: Validate non-commercial queue package safety
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = list(Path("media/queue-package").glob("*.json"))
          if len(files) != 1:
              raise SystemExit(f"Expected one queue package metadata file, found {len(files)}")
          data = json.loads(files[0].read_text(encoding="utf-8"))
          assert data.get("channel") == "SonicVhibez"
          assert data.get("productUrl") == "https://selar.com/0u19v8u99l"
          assert data.get("status") == "HOLD_FOR_FOOTAGE_AND_REVIEW"
          assert data.get("visibility") == "private"
          assert data.get("rightsConfirmed") is False
          assert data.get("complianceReviewed") is False
          assert data.get("voiceApprovalStatus") == "NOT_OWNER_APPROVED"
          assert data.get("licenseStatus") == "NON_COMMERCIAL_INTERNAL_EVALUATION_ONLY"
          assert data.get("commercialUseAllowed") is False
          assert data.get("productionUseAllowed") is False
          assert data.get("publishingEnabled") is False
          srt = files[0].with_suffix(".srt")
          assert srt.exists() and " --> " in srt.read_text(encoding="utf-8")
          print("PASS: queue package is private, internal audition only, not commercially cleared, and held for original media and human review.")
          PY
      - name: Validate non-commercial narration manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("media/narration/generation-summary.json").read_text(encoding="utf-8"))
          assert data["status"] == "INTERNAL_AUDITION_ONLY"
          assert data["voiceApprovalStatus"] == "NOT_OWNER_APPROVED"
          assert data["licenseStatus"] == "NON_COMMERCIAL_INTERNAL_EVALUATION_ONLY"
          assert data["commercialUseAllowed"] is False
          assert data["productionUseAllowed"] is False
          assert data["publishingEnabled"] is False
          print("PASS: narration is internal audition only; no commercial or production use is authorized.")
          PY
      - name: Report audio duration
        run: |
          python - <<'PY'
          from pathlib import Path
          from mutagen.mp3 import MP3
          for file in sorted(Path("media/narration").glob("*.mp3")):
              print(f"{file}: {MP3(file).info.length:.2f} seconds")
          PY
      - name: Upload non-commercial internal audition package
        uses: actions/upload-artifact@v4
        with:
          name: sonicvhibez-short-internal-audition-only
          path: |
            media/narration/*.mp3
            media/narration/generation-summary.json
            media/queue-package/*.mp3
            media/queue-package/*.txt
            media/queue-package/*.srt
            media/queue-package/*.json
          if-no-files-found: error
          retention-days: 7
