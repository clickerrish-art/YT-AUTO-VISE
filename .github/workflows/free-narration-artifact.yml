name: Generate free narration audio
on:
  workflow_dispatch:
    inputs:
      short:
        description: Narration to generate
        required: true
        type: choice
        options:
          - both
          - short-001
          - short-002
        default: both
  schedule:
    # Twice weekly, aligned with the queue refresh (GitHub Actions cron is UTC).
    - cron: "0 15 * * 2,5"
  push:
    branches: [main]
    paths:
      - "content/narration-master-short-001-and-002.md"
      - "scripts/generate-narration.py"
      - "scripts/generate-queue-package.py"
      - "scripts/render-queued-draft.py"
      - "scripts/render-thumbnail.mjs"
      - "scripts/render-photo-thumbnail.py"
      - ".github/workflows/free-narration-artifact.yml"
permissions:
  contents: read
jobs:
  generate-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-media.txt
      - name: Install free TTS client, audio metadata reader, and image library
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check --retries 3 --timeout 30 edge-tts mutagen pillow
      - name: Validate Python generators
        run: python -m py_compile scripts/generate-narration.py scripts/generate-queue-package.py scripts/render-queued-draft.py scripts/render-photo-thumbnail.py
      - name: Validate narration extraction
        run: python scripts/generate-narration.py --short both --extract-only
      - name: Generate natural US English narration
        env:
          SELECTED_SHORT: ${{ github.event.inputs.short || 'both' }}
        run: |
          python scripts/generate-narration.py --short "$SELECTED_SHORT" --voice en-US-GuyNeural --rate=-5%
      - name: Generate the next queued topic package
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: python scripts/generate-queue-package.py --run-number "$RUN_NUMBER" --voice en-US-GuyNeural --rate=-5%
      - name: Validate generated queue package safety
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = list(Path("media/queue-package").glob("*.json"))
          if len(files) != 1:
              raise SystemExit(f"Expected one queue package metadata file, found {len(files)}")
          data = json.loads(files[0].read_text(encoding="utf-8"))
          assert data.get("channel") == "SonicVhibez"
          assert data.get("productUrl") == "https://selar.com/0u19v8u99l"
          assert data.get("status") == "HOLD_FOR_FOOTAGE_AND_REVIEW"
          assert data.get("visibility") == "private"
          assert data.get("rightsConfirmed") is False
          assert data.get("complianceReviewed") is False
          srt = files[0].with_suffix(".srt")
          assert srt.exists() and " --> " in srt.read_text(encoding="utf-8")
          print("PASS: package targets SonicVhibez, approved product URL, and remains safely held for rights/review.")
          PY
      - name: Render vertical review-only video draft
        run: python scripts/render-queued-draft.py
      - name: Generate realistic wildlife photo thumbnail
        run: python scripts/render-photo-thumbnail.py
      - name: Validate rendered draft video
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          files = list(Path("media/rendered-drafts").glob("*-DRAFT.mp4"))
          if len(files) != 1:
              raise SystemExit(f"Expected one rendered MP4 draft, found {len(files)}")
          result = subprocess.run(["ffprobe", "-v", "error", "-show_entries", "stream=codec_type,width,height", "-show_entries", "format=duration", "-of", "json", str(files[0])], capture_output=True, text=True, check=True)
          data = json.loads(result.stdout)
          video = next((x for x in data.get("streams", []) if x.get("codec_type") == "video"), None)
          audio = next((x for x in data.get("streams", []) if x.get("codec_type") == "audio"), None)
          duration = float(data.get("format", {}).get("duration", 0))
          if not video or (video.get("width"), video.get("height")) != (1080, 1920) or not audio or not 50 <= duration <= 60:
              raise SystemExit(f"Rendered MP4 failed media checks: video={video}, audio={audio}, duration={duration}")
          metadata_files = [p for p in Path("media/rendered-drafts").glob("*.json") if p.name != "thumbnail-rights-evidence.json"]
          if len(metadata_files) != 1:
              raise SystemExit(f"Expected one rendered draft metadata JSON, found {len(metadata_files)}")
          metadata = json.loads(metadata_files[0].read_text(encoding="utf-8"))
          assert metadata.get("status") == "HOLD_FOR_FOOTAGE_AND_REVIEW"
          assert metadata.get("rightsConfirmed") is False and metadata.get("complianceReviewed") is False
          thumb = Path("media/rendered-drafts/thumbnail.jpg")
          assert thumb.exists() and thumb.stat().st_size > 50000, "Photo thumbnail missing or unexpectedly small"
          evidence = json.loads(Path("media/rendered-drafts/thumbnail-rights-evidence.json").read_text(encoding="utf-8"))
          assert evidence.get("sourcePage", "").startswith("https://www.pexels.com/")
          assert evidence.get("videoFootageRightsConfirmed") is False
          print(f"PASS: review draft is 1080x1920, {duration:.2f}s; photo thumbnail and provenance exist; public publishing remains held.")
          PY
      - name: Report audio duration
        run: |
          python - <<'PY'
          from pathlib import Path
          from mutagen.mp3 import MP3
          for file in sorted(Path("media/narration").glob("*.mp3")):
              print(f"{file}: {MP3(file).info.length:.2f} seconds")
          PY
      - name: Upload narration audio artifact for review
        uses: actions/upload-artifact@v4
        with:
          name: sonicvhibez-short-draft-package
          path: |
            media/narration/*.mp3
            media/queue-package/*
            media/rendered-drafts/*.mp4
            media/rendered-drafts/*.json
            media/rendered-drafts/thumbnail.jpg
            media/rendered-drafts/thumbnail-rights-evidence.json
          if-no-files-found: error
          retention-days: 30
