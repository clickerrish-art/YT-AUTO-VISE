name: Generate explicitly acknowledged non-commercial Edge TTS auditions (not production)
on:
  workflow_dispatch:
    inputs:
      short:
        description: Narration to audition
        required: true
        type: choice
        options:
          - both
          - short-001
          - short-002
        default: both
      allow_noncommercial_audition:
        description: Confirm this is an internal audition only; this voice is not Roderic and is not commercially cleared.
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  generate-audition:
    if: ${{ inputs.allow_noncommercial_audition == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Require explicit non-commercial audition acknowledgement
        env:
          ALLOW_NONCOMMERCIAL_AUDITION: ${{ inputs.allow_noncommercial_audition }}
        run: |
          if [ "$ALLOW_NONCOMMERCIAL_AUDITION" != "true" ]; then
            echo "::error::Blocked. Edge TTS is not the approved Roderic voice and is not commercially cleared."
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install audition dependencies
        run: python -m pip install --disable-pip-version-check edge-tts
      - name: Validate narration extraction
        run: python scripts/generate-narration.py --short "${{ inputs.short }}" --extract-only
      - name: Generate internal audition only
        run: python scripts/generate-narration.py --short "${{ inputs.short }}" --voice en-US-GuyNeural --rate=-10% --allow-noncommercial-audition
      - name: Verify non-commercial audition manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("media/narration/narration-audition-manifest.json").read_text(encoding="utf-8"))
          assert data["status"] == "INTERNAL_AUDITION_ONLY"
          assert data["voiceApprovalStatus"] == "NOT_OWNER_APPROVED"
          assert data["licenseStatus"] == "NON_COMMERCIAL_INTERNAL_EVALUATION_ONLY"
          assert data["commercialUseAllowed"] is False
          assert data["productionUseAllowed"] is False
          assert data["publishingEnabled"] is False
          assert data["voice"] == "en-US-GuyNeural"
          assert data["files"]
          print("PASS: explicitly acknowledged internal audition only; never production or commercial narration.")
          PY
      - name: Upload internal audition for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sonicvhibez-short-noncommercial-audition-only
          path: |
            media/narration/*.mp3
            media/narration/narration-audition-manifest.json
          if-no-files-found: error
          retention-days: 7
