name: Upload reviewed Short privately to SonicVhibez

on:
  workflow_dispatch:
    inputs:
      metadata_path:
        description: Reviewed metadata JSON committed to the repository
        required: true
        default: content/next-short.json
        type: string
      video_path:
        description: Reviewed MP4 committed to the repository or available in the checkout
        required: true
        default: media/next-short.mp4
        type: string
      job_id:
        description: Stable production job ID bound to the approval record
        required: true
        type: string
      approval_path:
        description: Path to the artifact-bound human approval JSON
        required: true
        type: string
      one_shot_authorization_path:
        description: Owner-issued one-shot authorization bound to this exact final upload
        required: true
        default: content/one-shot-private-upload-authorization.json
        type: string
      confirm_private_upload:
        description: Explicitly authorize one private-only upload attempt
        required: true
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - 'YES'
      confirm_emergency_stop_release:
        description: Separately release the YouTube emergency stop for this explicitly authorized one-shot operation
        required: true
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - 'YES'
      previous_ledger_run_id:
        description: Prior upload workflow run ID whose ledger must be restored; use NONE only for the first-ever attempt
        required: true
        default: NONE
        type: string

# Both private-upload entry points share a repository-wide concurrency group. The
# uploader's filesystem lock is runner-local, so it cannot serialize separate runners.
concurrency:
  group: sonicvhibez-private-upload
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  private-upload:
    if: ${{ inputs.confirm_private_upload == 'YES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out reviewed project
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install uploader dependencies
        run: npm ci --ignore-scripts
      - name: Refuse ledger bypass after any prior manual upload run
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_LEDGER_RUN_ID: ${{ inputs.previous_ledger_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PREVIOUS_LEDGER_RUN_ID" != "NONE" ]]; then
            if [[ ! "$PREVIOUS_LEDGER_RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "::error::previous_ledger_run_id must be NONE or a numeric GitHub Actions run ID."
              exit 2
            fi
            exit 0
          fi
          for workflow in upload-private.yml upload-artifact-privately.yml; do
            response="$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?event=workflow_dispatch&per_page=100")"
            run_count="$(jq -r '.workflow_runs | length' <<< "$response")"
            prior_count="$(jq --arg current "$GITHUB_RUN_ID" '[.workflow_runs[] | select((.id | tostring) != $current)] | length' <<< "$response")"
            if [[ "$prior_count" -gt 0 ]]; then
              echo "::error::previous_ledger_run_id cannot be NONE because prior manual private-upload workflow history exists. Restore the prior ledger and reconcile any uncertain outcome."
              exit 2
            fi
            if [[ "$run_count" -ge 100 ]]; then
              echo "::error::Cannot prove this is the first upload workflow run from the latest 100 runs. Supply previous_ledger_run_id."
              exit 2
            fi
          done
          echo "PASS: no prior manual private-upload workflow runs; first-ever ledger initialization permitted."
      - name: Restore the previous durable upload-attempt ledger
        if: ${{ inputs.previous_ledger_run_id != 'NONE' }}
        uses: actions/download-artifact@v4
        with:
          name: sonicvhibez-upload-ledger
          path: run-logs
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.previous_ledger_run_id }}
      - name: Verify required secrets are configured
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SONICVHIBEZ_CHANNEL_ID: ${{ secrets.SONICVHIBEZ_CHANNEL_ID }}
          CONFIRM_PRIVATE_UPLOAD: ${{ inputs.confirm_private_upload }}
          YOUTUBE_EMERGENCY_STOP: ${{ inputs.confirm_emergency_stop_release == 'YES' && 'false' || 'true' }}
        run: |
          missing=0
          for name in YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN SONICVHIBEZ_CHANNEL_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "BLOCKED: configure the four repository secrets before retrying."
            exit 2
          fi
      - name: Run strict metadata, media, and authenticated channel checks; upload privately only
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SONICVHIBEZ_CHANNEL_ID: ${{ secrets.SONICVHIBEZ_CHANNEL_ID }}
          CONFIRM_PRIVATE_UPLOAD: ${{ inputs.confirm_private_upload }}
          YOUTUBE_EMERGENCY_STOP: ${{ inputs.confirm_emergency_stop_release == 'YES' && 'false' || 'true' }}
          JOB_ID: ${{ inputs.job_id }}
          UPLOAD_APPROVAL_PATH: ${{ inputs.approval_path }}
          PRIVATE_UPLOAD_AUTHORIZATION_PATH: ${{ inputs.one_shot_authorization_path }}
          METADATA_PATH: ${{ inputs.metadata_path }}
          VIDEO_PATH: ${{ inputs.video_path }}
          UPLOAD_LOG_DIR: run-logs
        run: node scripts/upload-private.mjs "$METADATA_PATH" "$VIDEO_PATH"
      - name: Preserve upload-attempt ledger for reconciliation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonicvhibez-upload-ledger
          path: run-logs/upload-attempts.json
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve private-upload receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sonicvhibez-private-upload-receipt
          path: run-logs/upload-*.json
          if-no-files-found: error
          retention-days: 30
