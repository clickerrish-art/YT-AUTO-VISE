name: Upload reviewed Short privately to SonicVhibez

on:
  workflow_dispatch:
    inputs:
      metadata_path:
        description: Reviewed metadata JSON committed to the repository
        required: false
        default: content/next-short.json
        type: string
      video_path:
        description: Reviewed MP4 committed to the repository or available in the checkout
        required: false
        default: media/next-short.mp4
        type: string
      job_id:
        description: Stable production job ID bound to the approval record (required only for private upload)
        required: false
        type: string
      approval_path:
        description: Path to the artifact-bound human approval JSON (required only for private upload)
        required: false
        type: string
      one_shot_authorization_path:
        description: Owner-issued one-shot authorization bound to this exact final upload (required only for private upload)
        required: false
        default: content/one-shot-private-upload-authorization.json
        type: string
      confirm_private_upload:
        description: Explicitly authorize one private-only upload attempt
        required: true
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - 'YES'
      confirm_emergency_stop_release:
        description: Separately release the YouTube emergency stop for this explicitly authorized one-shot operation
        required: true
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - 'YES'
      previous_ledger_run_id:
        description: Latest prior run that actually executed private-upload and retained its ledger; use NONE when earlier runs were read-only or skipped
        required: true
        default: NONE
        type: string

# Both private-upload entry points share a repository-wide concurrency group. The
# uploader's filesystem lock is runner-local, so it cannot serialize separate runners.
concurrency:
  group: sonicvhibez-private-upload
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  # Default dispatch input is NO, so this job performs read-only identity/history
  # inventory verification. The upload job below remains gated by an explicit YES.
  verify-channel-read-only:
    if: ${{ inputs.confirm_private_upload != 'YES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out selected implementation branch
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run deterministic identity and pagination regression tests
        run: node --test test/verify-youtube-channel.test.mjs
      - name: Verify authenticated SonicVhibez channel and complete uploads inventory (read-only)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SONICVHIBEZ_CHANNEL_ID: ${{ secrets.SONICVHIBEZ_CHANNEL_ID }}
        run: node scripts/verify-youtube-channel.mjs

  private-upload:
    if: ${{ inputs.confirm_private_upload == 'YES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out reviewed project
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install uploader dependencies
        run: npm ci --ignore-scripts
      - name: Require exact upload inputs before any private-upload work
        env:
          METADATA_PATH: ${{ inputs.metadata_path }}
          VIDEO_PATH: ${{ inputs.video_path }}
          JOB_ID: ${{ inputs.job_id }}
          APPROVAL_PATH: ${{ inputs.approval_path }}
          AUTHORIZATION_PATH: ${{ inputs.one_shot_authorization_path }}
        shell: bash
        run: |
          set -euo pipefail
          for name in METADATA_PATH VIDEO_PATH JOB_ID APPROVAL_PATH AUTHORIZATION_PATH; do
            if [[ -z "${!name//[[:space:]]/}" ]]; then
              echo "::error::${name} is required when private upload is explicitly selected."
              exit 2
            fi
          done
          if [[ ! "$JOB_ID" =~ ^[A-Za-z0-9][A-Za-z0-9:_-]{2,119}$ ]]; then
            echo "::error::JOB_ID must be a stable 3-120 character identifier."
            exit 2
          fi
      - name: Validate previous upload ledger against executed private-upload jobs
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_LEDGER_RUN_ID: ${{ inputs.previous_ledger_run_id }}
        run: node scripts/validate-upload-ledger-run.mjs
      - name: Restore the previous durable upload-attempt ledger
        if: ${{ inputs.previous_ledger_run_id != 'NONE' }}
        uses: actions/download-artifact@v4
        with:
          name: sonicvhibez-upload-ledger
          path: run-logs
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.previous_ledger_run_id }}
      - name: Verify required secrets are configured
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SONICVHIBEZ_CHANNEL_ID: ${{ secrets.SONICVHIBEZ_CHANNEL_ID }}
          CONFIRM_PRIVATE_UPLOAD: ${{ inputs.confirm_private_upload }}
          YOUTUBE_EMERGENCY_STOP: ${{ inputs.confirm_emergency_stop_release == 'YES' && 'false' || 'true' }}
        run: |
          missing=0
          for name in YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN SONICVHIBEZ_CHANNEL_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "BLOCKED: configure the four repository secrets before retrying."
            exit 2
          fi
      - name: Run strict metadata, media, and authenticated channel checks; upload privately only
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SONICVHIBEZ_CHANNEL_ID: ${{ secrets.SONICVHIBEZ_CHANNEL_ID }}
          CONFIRM_PRIVATE_UPLOAD: ${{ inputs.confirm_private_upload }}
          YOUTUBE_EMERGENCY_STOP: ${{ inputs.confirm_emergency_stop_release == 'YES' && 'false' || 'true' }}
          JOB_ID: ${{ inputs.job_id }}
          UPLOAD_APPROVAL_PATH: ${{ inputs.approval_path }}
          PRIVATE_UPLOAD_AUTHORIZATION_PATH: ${{ inputs.one_shot_authorization_path }}
          METADATA_PATH: ${{ inputs.metadata_path }}
          VIDEO_PATH: ${{ inputs.video_path }}
          UPLOAD_LOG_DIR: run-logs
          CHANNEL_HISTORY_RECONCILIATION_PATH: content/youtube-history-reconciliation.json
        run: node scripts/upload-private.mjs "$METADATA_PATH" "$VIDEO_PATH"
      - name: Preserve upload-attempt ledger for reconciliation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonicvhibez-upload-ledger
          path: run-logs/upload-attempts.json
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve private-upload receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sonicvhibez-private-upload-receipt
          path: run-logs/upload-*.json
          if-no-files-found: error
          retention-days: 30
