name: Deployment recovery smoke
on:
  push:
    branches:
      - codex/marketing-machine-audit-fixes
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out candidate release
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify replacement, restart and persistent state
        run: node --test test/deployment-recovery.test.mjs
