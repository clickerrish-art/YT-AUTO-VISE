name: Dependency audit report
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install declared dependencies without lifecycle scripts
        run: npm install --ignore-scripts
      - name: Report exact npm advisories and dependency paths
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          audit_status=$?
          set -e
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const audit = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          console.log('Audit metadata:', JSON.stringify(audit.metadata?.vulnerabilities ?? {}, null, 2));
          for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              name,
              severity: item.severity,
              isDirect: item.isDirect,
              range: item.range,
              via: item.via,
              effects: item.effects,
              nodes: item.nodes,
              fixAvailable: item.fixAvailable
            }, null, 2));
          }
          NODE
          echo "npm audit exit status: $audit_status"
          if [ "$audit_status" -ne 0 ]; then
            echo "FAIL: npm audit reports vulnerabilities or could not complete."
            exit 1
          fi
