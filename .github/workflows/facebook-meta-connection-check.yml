name: Verify Nature Frontiers Meta Page connection

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - codex/marketing-machine-audit-fixes
      - codex/meta-trust-safety-hardening
    paths:
      - "config/facebook-publishing.json"
      - "scripts/meta-page-adapter.mjs"
      - "scripts/verify-meta-credentials.mjs"
      - "test/verify-meta-credentials.test.mjs"
      - "scripts/facebook-autonomous-publisher.mjs"
      - "scripts/meta-rate-limit.mjs"
      - ".github/workflows/facebook-autonomous-publisher.yml"
      - "test/meta-page-adapter.test.mjs"
      - "test/meta-rate-limit.test.mjs"
      - "test/facebook-policy-engine.test.mjs"
      - "test/facebook-autonomous-publisher.test.mjs"
      - "test/facebook-autonomous-publisher-workflow.test.mjs test/verify-meta-credentials.test.mjs"
      - ".github/workflows/facebook-meta-connection-check.yml"

permissions:
  contents: read

jobs:
  verify-read-only-meta-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NATURE_FRONTIERS_FACEBOOK_PAGE_ID: ${{ vars.NATURE_FRONTIERS_FACEBOOK_PAGE_ID }}
      META_USER_ACCESS_TOKEN: ${{ secrets.META_USER_ACCESS_TOKEN }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Run Meta token, rate-limit, publisher and policy regression tests
        run: |
          node --check scripts/verify-meta-credentials.mjs
          node --check scripts/meta-rate-limit.mjs
          node --check scripts/facebook-autonomous-publisher.mjs
          node --test test/meta-page-adapter.test.mjs test/meta-page-reel-adapter.test.mjs test/meta-rate-limit.test.mjs test/facebook-policy-engine.test.mjs test/facebook-autonomous-publisher.test.mjs test/facebook-autonomous-publisher-workflow.test.mjs
      - name: Verify user and Page tokens independently (read-only; no refresh)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/codex/marketing-machine-audit-fixes')
        run: node scripts/verify-meta-credentials.mjs
