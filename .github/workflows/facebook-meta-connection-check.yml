name: Verify Nature Frontiers Meta Page connection

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [codex/marketing-machine-audit-fixes]
    paths:
      - "config/facebook-publishing.json"
      - "scripts/meta-page-adapter.mjs"
      - ".github/workflows/facebook-meta-connection-check.yml"

permissions:
  contents: read

jobs:
  verify-read-only-meta-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NATURE_FRONTIERS_FACEBOOK_PAGE_ID: ${{ vars.NATURE_FRONTIERS_FACEBOOK_PAGE_ID }}
      META_USER_ACCESS_TOKEN: ${{ secrets.META_USER_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Verify configured secrets and owner-approved Page identity (read-only)
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { verifyMetaPageIdentity, verifyMetaPagePermissions } from "./scripts/meta-page-adapter.mjs";

          const config = JSON.parse(fs.readFileSync("config/facebook-publishing.json", "utf8"));
          const pageId = process.env.NATURE_FRONTIERS_FACEBOOK_PAGE_ID ?? "";
          const userToken = process.env.META_USER_ACCESS_TOKEN ?? "";

          if (!/^\d{5,30}$/.test(pageId)) throw new Error("Missing or invalid Actions variable NATURE_FRONTIERS_FACEBOOK_PAGE_ID");
          if (pageId !== config.destinationPageId) throw new Error("Actions Page ID does not match config/facebook-publishing.json");
          if (userToken.length < 20) throw new Error("Missing Actions secret META_USER_ACCESS_TOKEN");

          // Safe request diagnostics: record only the API stage, version, HTTP status and
          // Meta error identifiers. Never log tokens, query strings, response bodies or raw IDs.
          const diagnosticFetch = async (input, options) => {
            const rawUrl = typeof input === "string" ? input : input.url;
            const url = new URL(rawUrl);
            const apiVersion = url.pathname.split("/")[1] ?? "unknown";
            const path = url.pathname.replace(/\/\d{5,30}(?=\/permissions)/, "/{user-id}")
              .replace(/\/\d{5,30}(?=$)/, "/{page-id}");
            const stage = path.endsWith("/permissions") ? "user-permissions"
              : path.endsWith("/me") ? "user-identity"
              : path.endsWith("/me/accounts") ? "managed-page-list"
              : "page-identity";
            try {
              const response = await fetch(input, options);
              let metaError = {};
              if (stage === "user-identity" && response.ok) {
                const identityBody = await response.clone().json().catch(() => ({}));
                metaError.meIdMatchesConfiguredPageId = typeof identityBody?.id === "string" && identityBody.id === pageId;
              }
              if (!response.ok) {
                const body = await response.clone().json().catch(() => ({}));
                metaError = {
                  errorCode: body?.error?.code ?? null,
                  errorSubcode: body?.error?.error_subcode ?? null,
                  errorType: body?.error?.type ?? null,
                  fbtraceId: body?.error?.fbtrace_id ?? null
                };
              }
              console.log(JSON.stringify({ metaDiagnostic: true, stage, apiVersion, path, httpStatus: response.status, ...metaError }));
              return response;
            } catch {
              console.log(JSON.stringify({ metaDiagnostic: true, stage, apiVersion, path, networkFailure: true }));
              throw new Error("Meta request failed before an HTTP response at stage " + stage);
            }
          };

          const permissions = await verifyMetaPagePermissions({
            pageId, userAccessToken: userToken,
            apiVersion: config.apiVersion, fetchImpl: diagnosticFetch
          });
          const identity = await verifyMetaPageIdentity({
            pageId, expectedPageId: config.destinationPageId, expectedPageName: config.destinationPageName,
            accessToken: permissions.pageAccessToken, apiVersion: config.apiVersion, fetchImpl: diagnosticFetch
          });
          if (permissions.pageName !== identity.pageName) {
            throw new Error("Meta managed-Page lookup and direct Page identity returned different names");
          }

          console.log(JSON.stringify({
            result: "PASS",
            mode: "READ_ONLY_NO_PUBLISH",
            pageId: identity.pageId,
            pageName: identity.pageName,
            grantedPermissions: permissions.grantedPermissions,
            pageTasks: permissions.tasks,
            apiVersion: config.apiVersion,
            publishingEnabled: config.publishingEnabled,
            dryRun: config.dryRun,
            emergencyStop: config.emergencyStop
          }, null, 2));
          NODE
