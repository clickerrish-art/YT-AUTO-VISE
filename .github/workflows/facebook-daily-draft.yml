name: Generate daily Nature Frontiers Facebook draft

on:
  schedule:
    # 07:30 Africa/Johannesburg (UTC+2); schedule events run on the default branch only.
    - cron: "30 5 * * *"
  workflow_dispatch:
  push:
    branches: [main, codex/marketing-machine-audit-fixes]
    paths:
      - "scripts/generate-facebook-daily-draft.mjs"
      - "scripts/facebook-pipeline.mjs"
      - "scripts/restore-facebook-draft-history.mjs"
      - "test/facebook-daily-draft.test.mjs"
      - "test/restore-facebook-draft-history.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/facebook-daily-draft.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/generate-facebook-daily-draft.mjs"
      - "scripts/facebook-pipeline.mjs"
      - "scripts/restore-facebook-draft-history.mjs"
      - "test/facebook-daily-draft.test.mjs"
      - "test/restore-facebook-draft-history.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/facebook-daily-draft.yml"

permissions:
  contents: read
  actions: read

jobs:
  validate-candidate-draft:
    # Candidate pushes and PRs exercise the actual local draft generator and recovery tests.
    # This creates no competing retained artifact and performs no external Meta operation.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/codex/marketing-machine-audit-fixes')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Test daily draft and cross-run history recovery
        run: node --test test/facebook-daily-draft.test.mjs test/restore-facebook-draft-history.test.mjs
      - name: Generate a deterministic local draft-only package
        env:
          FACEBOOK_DAILY_DRAFT_DIR: ${{ runner.temp }}/facebook-candidate-drafts
          FACEBOOK_DAILY_DRAFT_DATE: "2030-10-25"
          FACEBOOK_DAILY_DRAFT_HISTORY_FILE: ""
        run: |
          npm run facebook:draft:daily
          test -s "$FACEBOOK_DAILY_DRAFT_DIR/2030-10-25.json"
      - name: Assert generated package is fail-closed and draft-only
        env:
          FACEBOOK_DAILY_DRAFT_DIR: ${{ runner.temp }}/facebook-candidate-drafts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const file = path.join(process.env.FACEBOOK_DAILY_DRAFT_DIR, '2030-10-25.json');
          const draft = JSON.parse(fs.readFileSync(file, 'utf8'));
          const checks = [
            [draft.id === 'nature-frontiers-daily-2030-10-25', 'stable draft identity'],
            [draft.destination === 'nature_frontiers_facebook', 'Nature Frontiers Facebook destination'],
            [draft.destinationPageId === null, 'no unverified Page ID'],
            [draft.timezone === 'Africa/Johannesburg', 'South African timezone'],
            [draft.publishReady === false && draft.publishingEnabled === false, 'publishing disabled'],
            [draft.media === null && draft.rightsEvidence === null, 'no fabricated media or rights evidence'],
            [Array.isArray(draft.blockers) && draft.blockers.length >= 4, 'actionable review blockers retained']
          ];
          const failed = checks.filter(([ok]) => !ok);
          for (const [ok, label] of checks) console.log((ok ? 'PASS ' : 'FAIL ') + label);
          if (failed.length) process.exit(1);
          NODE

  create-draft-package:
    # Only the default branch may emit a retained daily package.
    # Candidate validation above never creates a retained competing artifact.
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Restore recent cross-run editorial history
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          FACEBOOK_DAILY_DRAFT_HISTORY_FILE: ${{ runner.temp }}/facebook-history.json
        run: node scripts/restore-facebook-draft-history.mjs
      - name: Generate one idempotent research-only draft package
        env:
          FACEBOOK_DAILY_DRAFT_DIR: ${{ runner.temp }}/facebook-drafts
          FACEBOOK_DAILY_DRAFT_HISTORY_FILE: ${{ runner.temp }}/facebook-history.json
        run: npm run facebook:draft:daily
      - name: Retain draft package for operator review
        uses: actions/upload-artifact@v4
        with:
          name: nature-frontiers-facebook-draft-${{ github.run_id }}
          path: ${{ runner.temp }}/facebook-drafts/*.json
          if-no-files-found: error
          retention-days: 14
