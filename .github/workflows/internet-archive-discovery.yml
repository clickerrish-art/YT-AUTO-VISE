name: Internet Archive wildlife metadata discovery

on:
  schedule:
    - cron: '41 5 * * 3'
  workflow_dispatch:
    inputs:
      query:
        description: Internet Archive advanced-search query (metadata only)
        required: false
        type: string
        default: 'mediatype:movies AND (wildlife OR animal OR crocodile OR elephant OR lion OR shark OR whale OR bird OR reptile OR ocean OR nature)'
      rows:
        description: Maximum number of candidates (1–100)
        required: false
        type: number
        default: 30

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test rights triage
        run: python -m unittest tests.test_internet_archive_discovery -v
      - name: Search Internet Archive metadata only
        env:
          ARCHIVE_QUERY: ${{ inputs.query }}
          ARCHIVE_ROWS: ${{ inputs.rows }}
        run: |
          set -euo pipefail
          query="${ARCHIVE_QUERY:-mediatype:movies AND (wildlife OR animal OR crocodile OR elephant OR lion OR shark OR whale OR bird OR reptile OR ocean OR nature)}"
          rows="${ARCHIVE_ROWS:-30}"
          python scripts/discover_internet_archive_assets.py \
            --query "$query" --rows "$rows" \
            --output artifacts/internet-archive-discovery.json
      - name: Upload discovery report for rights review
        uses: actions/upload-artifact@v4
        with:
          name: sonicvhibez-internet-archive-discovery
          path: artifacts/internet-archive-discovery.json
          if-no-files-found: error
          retention-days: 30
