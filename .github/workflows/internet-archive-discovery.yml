name: Internet Archive wildlife metadata discovery

on:
  push:
    branches: [codex/marketing-machine-audit-fixes]
    paths:
      - '.github/workflows/internet-archive-discovery.yml'
      - 'scripts/discover_internet_archive_assets.py'
      - 'tests/test_internet_archive_discovery.py'
  schedule:
    - cron: '41 5 * * 3'
  workflow_dispatch:
    inputs:
      query:
        description: Internet Archive advanced-search query (metadata only)
        required: false
        type: string
        default: 'DEFAULT_QUERY = (
    collection:prelinger AND mediatype:movies AND 
    (title:wildlife OR title:crocodile OR title:alligator OR title:elephant 
    OR title:lion OR title:tiger OR title:leopard OR title:shark OR title:whale 
    OR title:dolphin OR title:bird OR title:reptile OR title:butterfly OR title:insect 
    OR title:underwater OR title:coral) AND 
    (licenseurl:"http://creativecommons.org/publicdomain/mark/1.0/" 
    OR licenseurl:"http://creativecommons.org/publicdomain/zero/1.0/")
)'
      rows:
        description: Maximum number of candidates (1–100)
        required: false
        type: number
        default: 30

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test rights triage
        run: python -m unittest discover -s tests -p 'test_internet_archive_discovery.py' -v
      - name: Search Internet Archive metadata only
        env:
          ARCHIVE_QUERY: ${{ inputs.query }}
          ARCHIVE_ROWS: ${{ inputs.rows }}
        run: |
          set -euo pipefail
          query="${ARCHIVE_QUERY:-DEFAULT_QUERY = (
    collection:prelinger AND mediatype:movies AND 
    (title:wildlife OR title:crocodile OR title:alligator OR title:elephant 
    OR title:lion OR title:tiger OR title:leopard OR title:shark OR title:whale 
    OR title:dolphin OR title:bird OR title:reptile OR title:butterfly OR title:insect 
    OR title:underwater OR title:coral) AND 
    (licenseurl:"http://creativecommons.org/publicdomain/mark/1.0/" 
    OR licenseurl:"http://creativecommons.org/publicdomain/zero/1.0/")
)}"
          rows="${ARCHIVE_ROWS:-30}"
          python scripts/discover_internet_archive_assets.py \
            --query "$query" --rows "$rows" \
            --output artifacts/internet-archive-discovery.json
      - name: Upload discovery report for rights review
        uses: actions/upload-artifact@v4
        with:
          name: sonicvhibez-internet-archive-discovery
          path: artifacts/internet-archive-discovery.json
          if-no-files-found: error
          retention-days: 30
