name: SonicVhibez twice-weekly readiness check
on:
  schedule:
    - cron: "0 15 * * 2"
    - cron: "0 15 * * 5"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Confirm example content is blocked for missing review approvals
        shell: bash
        run: |
          set +e
          output=$(npm run check -- content/next-short.example.json 2>&1)
          status=$?
          set -e
          printf '%s\\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "ERROR: unreviewed example passed checks."
            exit 1
          fi
          if ! printf '%s\\n' "$output" | grep -Fq "rightsConfirmed must be true"; then
            echo "ERROR: checker failed, but not for the expected review gate."
            exit 1
          fi
          if ! printf '%s\\n' "$output" | grep -Fq "complianceReviewed must be true"; then
            echo "ERROR: checker did not report the compliance review gate."
            exit 1
          fi
          echo "PASS: example is blocked specifically because rights and compliance reviews are not approved."
