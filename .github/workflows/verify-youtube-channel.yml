name: Verify SonicVhibez YouTube channel (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonicvhibez-youtube-readonly-verification
  cancel-in-progress: false

jobs:
  verify-channel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run deterministic identity and pagination regression tests
        run: node --test test/verify-youtube-channel.test.mjs
      - name: Verify authenticated SonicVhibez channel and complete uploads inventory (read-only)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SONICVHIBEZ_CHANNEL_ID: ${{ secrets.SONICVHIBEZ_CHANNEL_ID }}
        run: node scripts/verify-youtube-channel.mjs
