name: Cloudflare durable-state unit checks

on:
  pull_request:
    branches: [codex/marketing-machine-audit-fixes]
    paths:
      - "cloudflare/**"
      - "cloudflare.config.ts"
      - "test/cloudflare-state-worker.test.mjs"
      - ".github/workflows/cloudflare-state.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durable-state:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Check Worker and tests syntax
        run: |
          node --check cloudflare/worker.js
          node --check test/cloudflare-state-worker.test.mjs
      - name: Run durable-state unit tests
        run: node --test test/cloudflare-state-worker.test.mjs
