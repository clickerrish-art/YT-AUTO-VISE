name: Dashboard Cloudflare state adapter checks

on:
  push:
    branches: [codex/dashboard-cloudflare-adapter]
    paths:
      - "cloudflare/**"
      - "wrangler.jsonc"
      - "test/cloudflare-state-worker.test.mjs"
      - "scripts/cloudflare-runner-bridge.mjs"
      - "scripts/cloudflare-artifact-sync.mjs"
      - ".github/workflows/repository-runner.yml"
      - ".github/workflows/cloudflare-state.yml"
      - ".github/workflows/dashboard-cloudflare-adapter.yml"
  pull_request:
    branches: [codex/marketing-machine-audit-fixes]
    paths:
      - "cloudflare/**"
      - "wrangler.jsonc"
      - "test/cloudflare-state-worker.test.mjs"
      - "scripts/cloudflare-runner-bridge.mjs"
      - "scripts/cloudflare-artifact-sync.mjs"
      - ".github/workflows/repository-runner.yml"
      - ".github/workflows/cloudflare-state.yml"
      - ".github/workflows/dashboard-cloudflare-adapter.yml"

permissions:
  contents: read

jobs:
  durable-state:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Syntax checks
        run: |
          node --check cloudflare/worker.js
          node --check scripts/cloudflare-runner-bridge.mjs
          node --check scripts/cloudflare-artifact-sync.mjs
          node --check test/cloudflare-state-worker.test.mjs
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/repository-runner.yml")'
      - name: Durable-state tests
        run: node --test test/cloudflare-state-worker.test.mjs
