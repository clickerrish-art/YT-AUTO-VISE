name: Cloudflare staging runner fail-closed live smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/cloudflare-staging-runner-live-smoke.yml"
      - "cloudflare/worker.js"
      - "cloudflare/staging-snapshot/worker.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-staging-runner-live-smoke
  cancel-in-progress: false

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Verify repository runner OIDC is disabled by default
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_ACCESS_CLIENT_ID:?Cloudflare Access client ID secret is required}"
          : "${CLOUDFLARE_ACCESS_CLIENT_SECRET:?Cloudflare Access client secret is required}"
          response="$(mktemp)"
          headers="$(mktemp)"
          trap 'rm -f "$response" "$headers"' EXIT
          status="$(curl --silent --show-error --max-time 20 \
            --dump-header "$headers" --output "$response" --write-out '%{http_code}' \
            --request POST \
            --header "CF-Access-Client-Id: ${CLOUDFLARE_ACCESS_CLIENT_ID}" \
            --header "CF-Access-Client-Secret: ${CLOUDFLARE_ACCESS_CLIENT_SECRET}" \
            --header 'content-type: application/json' \
            --data '{}' \
            'https://sonicvhibez-durable-state-staging.kajiboye44.workers.dev/api/runner/session')"
          echo "Runner endpoint HTTP status: $status"
          cat "$headers"
          cat "$response"
          test "$status" = "503"
          node -e 'const b=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")); if(b.code!=="RUNNER_OIDC_DISABLED" || b.publishingEnabled!==false) process.exit(1)' "$response"
          echo "Live runner gate returned 503 RUNNER_OIDC_DISABLED; no runner session was created."

      - name: Verify operator-only runner status remains authenticated
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          status="$(curl --silent --show-error --max-time 20 \
            --output "$response" --write-out '%{http_code}' \
            --header "CF-Access-Client-Id: ${CLOUDFLARE_ACCESS_CLIENT_ID}" \
            --header "CF-Access-Client-Secret: ${CLOUDFLARE_ACCESS_CLIENT_SECRET}" \
            'https://sonicvhibez-durable-state-staging.kajiboye44.workers.dev/api/runner/session/status')"
          echo "Operator status endpoint HTTP status: $status"
          cat "$response"
          test "$status" = "401"
          node -e 'const b=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")); if(b.error!=="Unauthorized") process.exit(1)' "$response"
          echo "Operator-only status endpoint rejects unauthenticated requests."

      - name: Verify operator-only runner release remains authenticated
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          status="$(curl --silent --show-error --max-time 20 \
            --output "$response" --write-out '%{http_code}' \
            --request POST \
            --header "CF-Access-Client-Id: ${CLOUDFLARE_ACCESS_CLIENT_ID}" \
            --header "CF-Access-Client-Secret: ${CLOUDFLARE_ACCESS_CLIENT_SECRET}" \
            --header 'content-type: application/json' \
            --data '{}' \
            'https://sonicvhibez-durable-state-staging.kajiboye44.workers.dev/api/runner/session/release')"
          echo "Operator release endpoint HTTP status: $status"
          cat "$response"
          test "$status" = "401"
          node -e 'const b=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")); if(b.error!=="Unauthorized") process.exit(1)' "$response"
          echo "Operator-only release endpoint rejects unauthenticated requests."
