name: Validate Cloudflare durable-state pull requests

on:
  pull_request:
    paths:
      - "cloudflare/**"
      - "cloudflare.config.ts"
      - "test/cloudflare-state-worker.test.mjs"
      - "test/dashboard-worker-api.integration.test.mjs"
      - ".github/workflows/cloudflare-state.yml"
      - ".github/workflows/cloudflare-durable-state-pr-check.yml"

permissions:
  contents: read

jobs:
  durable-state:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Check Worker and test syntax
        run: |
          node --check cloudflare/worker.js
          node --check test/cloudflare-state-worker.test.mjs
          node --check test/dashboard-worker-api.integration.test.mjs
      - name: Run Cloudflare durable-state Worker unit tests
        run: node --test test/cloudflare-state-worker.test.mjs
      - name: Run scoped dashboard Worker API integration test
        run: node --test test/dashboard-worker-api.integration.test.mjs
