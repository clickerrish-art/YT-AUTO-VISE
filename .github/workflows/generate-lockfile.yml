name: Generate and verify npm lockfile

on:
  push:
    branches:
      - codex/marketing-machine-audit-fixes
    paths:
      - package.json
      - .npmrc
      - .github/workflows/generate-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockfile-generation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install FFmpeg and ffprobe from pinned static build
        uses: AnimMouse/setup-ffmpeg@178e0b4a408f06ce40d896c3cd79f50fa6f8b0c3
        with:
          version: "9.0"
          token: ${{ github.token }}
      - name: Decide whether the lockfile must be generated or refreshed
        id: lockfile-status
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          refresh=false
          if ! test -f package-lock.json; then
            refresh=true
          elif node --input-type=module <<'NODE'
          import fs from "node:fs";
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const expected = pkg.dependencies ?? {};
          const actual = lock.packages?.[""]?.dependencies ?? {};
          const expectedDev = pkg.devDependencies ?? {};
          const actualDev = lock.packages?.[""]?.devDependencies ?? {};
          const mismatch = Object.entries(expected).some(([name, version]) => actual[name] !== version)
            || Object.keys(actual).some(name => !(name in expected))
            || Object.entries(expectedDev).some(([name, version]) => actualDev[name] !== version)
            || Object.keys(actualDev).some(name => !(name in expectedDev));
          process.exit(mismatch ? 0 : 1);
          NODE
          then
            refresh=true
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BEFORE_SHA" || {
                echo "Cannot inspect the push base commit; refusing to assume the lockfile is current."
                exit 1
              }
            fi
            if git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" -- package.json | grep -qx "package.json"; then
              refresh=true
            fi
          fi
          echo "refresh=$refresh" >> "$GITHUB_OUTPUT"
      - name: Generate or refresh lockfile without lifecycle scripts
        if: ${{ steps.lockfile-status.outputs.refresh == 'true' }}
        run: npm install --package-lock-only --ignore-scripts
      - name: Prove clean locked installation
        run: npm ci --ignore-scripts
      # Full application tests, schedule/campaign validators and syntax checks run in validate-automation.yml.
      # This workflow only regenerates the lockfile when dependency manifests change and proves npm ci works.
      - name: Commit lockfile to implementation branch only
        if: ${{ steps.lockfile-status.outputs.refresh == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile change to commit."
          else
            git commit -m "build: add reproducible npm lockfile"
            git push origin HEAD:refs/heads/codex/marketing-machine-audit-fixes
          fi
      - name: Preserve generated lockfile for recovery if commit is blocked
        if: ${{ always() && steps.lockfile-status.outputs.refresh == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-npm-lockfile
          path: package-lock.json
          if-no-files-found: warn
          retention-days: 7
