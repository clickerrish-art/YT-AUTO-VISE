name: Generate and verify npm lockfile

on:
  push:
    branches:
      - codex/marketing-machine-audit-fixes
    paths-ignore:
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockfile-generation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: codex/marketing-machine-audit-fixes
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check whether a lockfile already exists
        id: lockfile-status
        run: |
          if test -f package-lock.json; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate lockfile without lifecycle scripts
        if: ${{ steps.lockfile-status.outputs.present == 'false' }}
        run: npm install --package-lock-only --ignore-scripts
      - name: Prove clean locked installation
        if: ${{ always() && (steps.lockfile-status.outputs.present == 'true' || success()) }}
        run: npm ci --ignore-scripts
      - name: Run complete Node test suite
        if: ${{ always() && (steps.lockfile-status.outputs.present == 'true' || success()) }}
        run: npm test
      - name: Validate schedule and campaign configuration
        if: ${{ always() && (steps.lockfile-status.outputs.present == 'true' || success()) }}
        run: |
          npm run validate:schedule
          npm run validate:campaigns
      - name: Check JavaScript syntax
        if: ${{ always() && (steps.lockfile-status.outputs.present == 'true' || success()) }}
        run: |
          find scripts test tests -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Commit lockfile to implementation branch only
        if: ${{ steps.lockfile-status.outputs.present == 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile change to commit."
          else
            git commit -m "build: add reproducible npm lockfile"
            git push origin HEAD:refs/heads/codex/marketing-machine-audit-fixes
          fi
      - name: Preserve generated lockfile for recovery if commit is blocked
        if: ${{ always() && steps.lockfile-status.outputs.present == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-npm-lockfile
          path: package-lock.json
          if-no-files-found: warn
          retention-days: 7
