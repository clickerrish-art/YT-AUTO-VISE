name: Upload a reviewed draft artifact privately

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful draft-generation GitHub Actions run ID
        required: true
        type: string
      reviewed_metadata_path:
        description: Human-reviewed metadata JSON already committed to this repository
        required: true
        default: content/next-short.json
        type: string
      job_id:
        description: Stable production job ID bound to the approval record
        required: true
        type: string
      approval_path:
        description: Path to the artifact-bound human approval JSON
        required: true
        type: string
      one_shot_authorization_path:
        description: Owner-issued one-shot authorization bound to this exact final upload
        required: true
        default: content/one-shot-private-upload-authorization.json
        type: string
      confirm_private_upload:
        description: Explicitly authorize one private-only upload attempt
        required: true
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - 'YES'
      confirm_emergency_stop_release:
        description: Separately release the YouTube emergency stop for this explicitly authorized one-shot operation
        required: true
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - 'YES'
      previous_ledger_run_id:
        description: Prior upload workflow run ID whose ledger must be restored; use NONE only for the first-ever attempt
        required: true
        default: NONE
        type: string

permissions:
  contents: read
  actions: read

jobs:
  private-upload:
    if: ${{ inputs.confirm_private_upload == 'YES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out reviewed project
        uses: actions/checkout@v7
      - name: Download draft package from the selected run
        uses: actions/download-artifact@v4
        with:
          name: sonicvhibez-short-draft-package
          path: review-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
      - name: Require exactly one rendered draft video
        id: select-video
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t videos < <(find review-artifact -type f -name '*-DRAFT.mp4' -print | sort)
          if [ "${#videos[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one rendered draft MP4 in the selected artifact; found ${#videos[@]}."
            find review-artifact -maxdepth 5 -type f -print || true
            exit 1
          fi
          video="${videos[0]}"
          metadata="${video%-DRAFT.mp4}.json"
          if [ ! -f "$metadata" ]; then
            echo "::error::Matching generated metadata JSON is missing: $metadata"
            exit 1
          fi
          echo "video_path=$video" >> "$GITHUB_OUTPUT"
          echo "artifact_metadata_path=$metadata" >> "$GITHUB_OUTPUT"
          echo "Selected draft and matching metadata: $video"
      - name: Ensure reviewed metadata matches the selected draft
        env:
          REVIEWED_METADATA_PATH: ${{ inputs.reviewed_metadata_path }}
          ARTIFACT_METADATA_PATH: ${{ steps.select-video.outputs.artifact_metadata_path }}
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          reviewed_path = Path(os.environ["REVIEWED_METADATA_PATH"])
          artifact_path = Path(os.environ["ARTIFACT_METADATA_PATH"])
          if not reviewed_path.is_file() or not artifact_path.is_file():
              sys.exit("BLOCKED: reviewed or artifact metadata file is missing.")
          reviewed = json.loads(reviewed_path.read_text(encoding="utf-8"))
          artifact = json.loads(artifact_path.read_text(encoding="utf-8"))
          for field in ("channel", "queueItemId", "title", "productUrl"):
              if reviewed.get(field) != artifact.get(field):
                  sys.exit(f"BLOCKED: reviewed metadata does not match this artifact for field {field!r}.")
          if artifact.get("channel") != "SonicVhibez" or artifact.get("productUrl") != "https://selar.com/0u19v8u99l":
              sys.exit("BLOCKED: artifact channel or product URL is not approved.")
          print("PASS: reviewed metadata is bound to the selected artifact and approved product.")
          PY
      - name: Restore the previous durable upload-attempt ledger
        if: ${{ inputs.previous_ledger_run_id != 'NONE' }}
        uses: actions/download-artifact@v4
        with:
          name: sonicvhibez-upload-ledger
          path: run-logs
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.previous_ledger_run_id }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install uploader dependencies
        run: npm ci --ignore-scripts
      - name: Verify required secrets are configured
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SONICVHIBEZ_CHANNEL_ID: ${{ secrets.SONICVHIBEZ_CHANNEL_ID }}
          CONFIRM_PRIVATE_UPLOAD: ${{ inputs.confirm_private_upload }}
          YOUTUBE_EMERGENCY_STOP: ${{ inputs.confirm_emergency_stop_release == 'YES' && 'false' || 'true' }}
        run: |
          missing=0
          for name in YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN SONICVHIBEZ_CHANNEL_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "BLOCKED: configure the four repository secrets before retrying."
            exit 2
          fi
      - name: Strictly validate reviewed metadata, media, and channel; upload privately only
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SONICVHIBEZ_CHANNEL_ID: ${{ secrets.SONICVHIBEZ_CHANNEL_ID }}
          CONFIRM_PRIVATE_UPLOAD: ${{ inputs.confirm_private_upload }}
          YOUTUBE_EMERGENCY_STOP: ${{ inputs.confirm_emergency_stop_release == 'YES' && 'false' || 'true' }}
          JOB_ID: ${{ inputs.job_id }}
          UPLOAD_APPROVAL_PATH: ${{ inputs.approval_path }}
          PRIVATE_UPLOAD_AUTHORIZATION_PATH: ${{ inputs.one_shot_authorization_path }}
          METADATA_PATH: ${{ inputs.reviewed_metadata_path }}
          VIDEO_PATH: ${{ steps.select-video.outputs.video_path }}
          UPLOAD_LOG_DIR: run-logs
        run: node scripts/upload-private.mjs "$METADATA_PATH" "$VIDEO_PATH"
      - name: Preserve upload-attempt ledger for reconciliation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonicvhibez-upload-ledger
          path: run-logs/upload-attempts.json
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve private-upload receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sonicvhibez-private-upload-receipt
          path: run-logs/upload-*.json
          if-no-files-found: error
          retention-days: 30
