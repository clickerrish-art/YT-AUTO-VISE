name: Verify SonicVhibez YouTube identity and uploads inventory (read-only)

# workflow_dispatch is available only after this workflow is present on the
# repository's default branch. Until then, changes to this file on the
# implementation branch intentionally trigger the same read-only job via push.
on:
  push:
    branches: [codex/marketing-machine-audit-fixes]
    paths:
      - "scripts/verify-youtube-channel.mjs"
      - "scripts/youtube-oauth-scope.mjs"
      - "test/verify-youtube-channel.test.mjs"
      - "test/youtube-oauth-scope.test.mjs"
      - "scripts/production-readiness.mjs"
      - "content/youtube-history-reconciliation.json"
      - "content/long-form-render-manifest.json"
      - "content/long-form-001-youtube-metadata-draft.md"
      - ".github/workflows/production-readiness.yml"
      - ".github/workflows/verify-youtube-channel-readonly.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonicvhibez-youtube-readonly-inventory
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run deterministic OAuth-scope, identity and pagination tests
        run: node --test test/youtube-oauth-scope.test.mjs test/verify-youtube-channel.test.mjs
      # Do not upload raw private/unlisted video metadata to a public repository artifact.
      # Until an owner-controlled private/encrypted destination exists, retain only aggregate counts in the run output.
      - name: Verify authenticated channel, upload scope and complete uploads inventory (read-only, aggregate-only)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SONICVHIBEZ_CHANNEL_ID: ${{ secrets.SONICVHIBEZ_CHANNEL_ID }}
        run: node scripts/verify-youtube-channel.mjs
