name: Acquire licensed wildlife footage through official APIs

on:
  workflow_dispatch:
    inputs:
      review_only:
        description: Confirm that all downloaded footage is for internal review only and is not publication approval.
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: official-licensed-stock-review
  cancel-in-progress: false

jobs:
  acquire:
    name: Acquire and verify Pexels/Pixabay media through official APIs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
    steps:
      - name: Require review-only acknowledgement
        env:
          REVIEW_ONLY: ${{ inputs.review_only }}
        run: |
          if [ "$REVIEW_ONLY" != "true" ]; then
            echo "::error::This workflow only acquires footage for internal review; it never authorizes publication."
            exit 1
          fi

      - name: Check out exact source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned FFmpeg and ffprobe
        uses: AnimMouse/setup-ffmpeg@178e0b4a408f06ce40d896c3cd79f50fa6f8b0c3
        with:
          version: "9.0"
          token: ${{ github.token }}

      - name: Validate owner-approved media policy
        run: |
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const owner = JSON.parse(fs.readFileSync("content/owner-media-policy-override-2026-11-22.json", "utf8"));
          const policy = JSON.parse(fs.readFileSync("content/approved-pexels-footage.json", "utf8")).currentProductionPolicy;
          if (owner.status !== "ACTIVE_WITH_ASSET_LEVEL_REVIEW_GATES" ||
              owner.mediaRules?.pexelsLicensedStockAllowed !== true ||
              owner.mediaRules?.pixabayLicensedStockAllowed !== true ||
              owner.mediaRules?.stockVideoFootageAllowed !== true ||
              owner.mediaRules?.stockPhotographsAllowed !== false ||
              owner.mediaRules?.aiGeneratedWildlifeVisualsAllowed !== false ||
              policy?.pexelsAllowed !== true ||
              policy?.pixabayAllowed !== true ||
              policy?.aiGeneratedWildlifeVisualsAllowed !== false) {
            throw new Error("Owner-approved Pexels/Pixabay stock-video policy is missing or unsafe.");
          }
          console.log("PASS: licensed stock video is allowed for review; publication and third-party-rights gates remain closed.");
          NODE

      - name: Check official API acquisition scripts
        run: |
          node --check scripts/acquire-pexels-via-official-api.mjs
          node --check scripts/acquire-pixabay-via-official-api.mjs

      - name: Report missing free API credentials
        run: |
          if [ -z "$PEXELS_API_KEY" ]; then
            echo "::notice::PEXELS_API_KEY is not configured. Pexels API acquisition will be skipped; no direct-CDN or scraping fallback is permitted."
          fi
          if [ -z "$PIXABAY_API_KEY" ]; then
            echo "::notice::PIXABAY_API_KEY is not configured. Pixabay API acquisition will be skipped; no page-scraping fallback is permitted."
          fi
          if [ -z "$PEXELS_API_KEY" ] && [ -z "$PIXABAY_API_KEY" ]; then
            echo "::notice::No stock footage was downloaded. Add the free API keys as repository Actions secrets or provide original MP4 files."
          fi

      - name: Restore Pixabay API response cache (24-hour cache policy)
        if: env.PIXABAY_API_KEY != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: cache/pixabay-api-cache.json
          key: pixabay-api-cache-v1-${{ github.run_id }}
          restore-keys: |
            pixabay-api-cache-v1-

      - name: Acquire Pexels assets through official API
        id: pexels
        if: env.PEXELS_API_KEY != ''
        continue-on-error: true
        run: node scripts/acquire-pexels-via-official-api.mjs

      - name: Upload Pexels originals and verification evidence
        if: always() && env.PEXELS_API_KEY != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sonicvhibez-pexels-official-api-review
          path: artifacts/official-api-pexels-review/
          if-no-files-found: ignore
          retention-days: 14

      - name: Acquire Pixabay assets through official API
        id: pixabay
        if: env.PIXABAY_API_KEY != ''
        continue-on-error: true
        run: node scripts/acquire-pixabay-via-official-api.mjs

      - name: Upload Pixabay originals and verification evidence
        if: always() && env.PIXABAY_API_KEY != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sonicvhibez-pixabay-official-api-review
          path: artifacts/official-api-pixabay-review/
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarize acquisition gate
        if: always()
        run: |
          echo "Pexels API step outcome: ${{ steps.pexels.outcome || 'skipped' }}"
          echo "Pixabay API step outcome: ${{ steps.pixabay.outcome || 'skipped' }}"
          echo "All successful downloads remain review-only. Human review, third-party rights, exact-SHA release approval and publishing authorization are separate mandatory gates."
