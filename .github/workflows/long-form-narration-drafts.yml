name: Generate long-form narration drafts

on:
  workflow_dispatch:
  push:
    paths:
      - "content/long-form-scripts.md"
      - "scripts/generate-long-form-narration.py"
      - ".github/workflows/long-form-narration-drafts.yml"

permissions:
  contents: read

jobs:
  generate-narration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install speech generation dependency
        run: python -m pip install --disable-pip-version-check edge-tts
      - name: Generate review-only MP3 drafts
        run: python scripts/generate-long-form-narration.py
      - name: Upload narration draft artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sonicvhibez-long-form-narration-drafts
          path: artifacts/narration/
          if-no-files-found: error
          retention-days: 14
