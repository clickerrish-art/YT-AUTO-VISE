name: Dashboard browser end-to-end acceptance

on:
  push:
    branches: [codex/marketing-machine-audit-fixes]
    paths:
      - "browser-tests/**"
      - "test/api-route-acceptance-matrix.test.mjs"
      - "test/dashboard-api-auth-matrix.test.mjs"
      - "docs/API_ROUTE_ACCEPTANCE_MATRIX.json"
      - "public/dashboard.html"
      - "scripts/dashboard-server.mjs"
      - "scripts/campaign-management.mjs"
      - "scripts/validate-campaigns.mjs"
      - "package.json"
      - "playwright.config.*"
      - ".github/workflows/dashboard-browser-e2e.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dashboard-browser-e2e-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium and operating-system dependencies
        run: npx playwright install --with-deps chromium
      - name: Install FFmpeg and ffprobe from pinned static build
        uses: AnimMouse/setup-ffmpeg@178e0b4a408f06ce40d896c3cd79f50fa6f8b0c3
        with:
          version: "7.1"
          token: ${{ github.token }}
      - name: Install free Edge TTS and verify media tools
        run: |
          set -euo pipefail
          timeout 240s python -m pip install --disable-pip-version-check --retries 2 --timeout 20 edge-tts
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          ffprobe -version
      - name: Run browser acceptance against the real local dashboard/backend
        run: npm run test:browser
