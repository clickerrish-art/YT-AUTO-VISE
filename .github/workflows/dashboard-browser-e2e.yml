name: Dashboard browser end-to-end acceptance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dashboard-browser-e2e-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium and operating-system dependencies
        run: npx playwright install --with-deps chromium
      - name: Install free Edge TTS and verify FFmpeg for the real narration journey
        run: |
          set -euo pipefail
          timeout 240s python -m pip install --disable-pip-version-check --retries 2 --timeout 20 edge-tts
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
            timeout 480s sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          ffprobe -version
      - name: Run browser acceptance against the real local dashboard/backend
        run: npm run test:browser
