name: Validate SonicVhibez metadata
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: node --check scripts/render-long-form.mjs
      - run: node --check test/render-long-form.test.mjs
      - run: node --check scripts/validate-asset-register.mjs
      - run: node --check test/validate-asset-register.test.mjs
      - run: node --check scripts/validate-schedule.mjs
      - run: npm test
      - name: Confirm default metadata checker fails closed until all production gates pass
        run: |
          set +e
          output=$(npm run check 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "BLOCKED: default metadata checker unexpectedly passed without a reviewed production metadata file."
            exit 1
          fi
          if { [ "$status" -ne 1 ] && [ "$status" -ne 2 ]; } || ! printf '%s' "$output" | grep -Fq 'BLOCKED'; then
            echo "BLOCKED: npm run check failed for an unexpected reason (exit $status)."
            exit 1
          fi
          echo "PASS: npm run check fails closed because the checked-in metadata does not satisfy all current production gates."
      - name: Validate authoritative draft schedule
        run: npm run validate:schedule
      - name: Report production blockers without publishing
        run: |
          set +e
          output=$(npm run readiness 2>&1)
          status=$?
          set -e
          printf '%s\\n' "$output"
          if [ "$status" -ne 2 ] || ! printf '%s' "$output" | grep -Fq 'HOLD:'; then
            echo "BLOCKED: readiness must exit 2 and report HOLD while mandatory production gates are unresolved."
            exit 1
          fi
          echo "PASS: readiness reports the current blockers and exits non-zero; production is not accepted."
      - name: Validate timed subtitle drafts
        run: npm run check:captions
      - name: Ensure all unreviewed metadata examples are blocked
        run: |
          set +e
          npm run check -- content/next-short.example.json
          base_status=$?
          npm run check -- content/short-001-metadata.example.json
          short1_status=$?
          npm run check -- content/short-002-metadata.example.json
          short2_status=$?
          set -e
          if [ "$base_status" -eq 0 ] || [ "$short1_status" -eq 0 ] || [ "$short2_status" -eq 0 ]; then
            echo "An unreviewed metadata template unexpectedly passed validation."
            exit 1
          fi
          echo "PASS: all unreviewed metadata templates remain blocked."
          set +e
          node scripts/validate-asset-register.mjs content/asset-register.example.json
          asset_status=$?
          set -e
          if [ "$asset_status" -eq 0 ]; then
            echo "An unreviewed asset register example unexpectedly passed validation."
            exit 1
          fi
          echo "PASS: unreviewed asset register example remains blocked."
