name: Validate SonicVhibez metadata
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: npm test
      - name: Check example is blocked by default
        run: |
          set +e
          SONICVHIBEZ_CHANNEL_ID="UCSlkuPfHH78oGC1o418HV4w" npm run check -- content/next-short.example.json
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Unsafe example unexpectedly passed validation."
            exit 1
          fi
          echo "Expected result: unreviewed example is blocked."
