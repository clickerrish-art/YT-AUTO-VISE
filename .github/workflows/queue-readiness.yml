name: Queue readiness
on:
  push:
    branches: [main]
    paths:
      - "scripts/replenish-queue.mjs"
      - "scripts/production-readiness.mjs"
      - "tests/**"
      - "scripts/render-short.mjs"
      - "package.json"
      - "README.md"
      - "content/queue.json"
      - "content/*.srt"
      - "content/*.md"
      - "content/*.json"
      - ".github/workflows/queue-readiness.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/replenish-queue.mjs"
      - "scripts/production-readiness.mjs"
      - "tests/**"
      - "scripts/render-short.mjs"
      - "package.json"
      - "README.md"
      - "content/queue.json"
      - "content/*.srt"
      - "content/*.md"
      - "content/*.json"
      - ".github/workflows/queue-readiness.yml"
  workflow_dispatch:
  schedule:
    # Operational queue-readiness/replenishment check only; it does not publish.
    - cron: "0 15 * * 2,4,6"
permissions:
  contents: read
jobs:
  validate-and-propose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install production dependencies for regression tests
        run: npm install --ignore-scripts
      - name: Check JavaScript syntax
        run: |
          node --check scripts/replenish-queue.mjs
          node --check scripts/check-content.mjs
          node --check scripts/check-captions.mjs
          node --check scripts/preflight-media.mjs
          node --check scripts/render-short.mjs
          node --check scripts/production-readiness.mjs
          node --check scripts/upload-private.mjs
      - name: Install FFmpeg for media integration tests
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "FFmpeg and FFprobe are already available; skipping package installation."
          else
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Run repository regression tests
        run: node --test
      - name: Validate rolling publication policy and draft-preparation slots
        run: npm run validate:schedule
      - name: Record production readiness HOLD without stopping safe queue preparation
        run: |
          if node scripts/production-readiness.mjs --json > "$RUNNER_TEMP/production-readiness.json"; then
            echo "Production readiness report: prerequisites are present. This workflow still does not publish."
          else
            readiness_status=$?
            if [ "$readiness_status" -ne 2 ]; then
              echo "Production readiness command failed unexpectedly with exit code $readiness_status."
              exit "$readiness_status"
            fi
            echo "::warning::Production readiness is HOLD. The structured blocker report is retained with the isolated queue proposal; safe draft preparation may continue."
            {
              echo "## Production readiness: HOLD"
              echo "- The read-only readiness check reported blockers (exit 2)."
              echo "- This is not a production pass and does not authorize upload, scheduling or publication."
              echo "- Safe local queue validation and isolated proposal generation continue independently."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Validate existing caption files
        run: node scripts/check-captions.mjs content/short-001-wildlife-video-storytelling.srt content/short-002-plan-wildlife-documentary.srt
      - name: Validate queue and approved product URLs
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          const q = JSON.parse(fs.readFileSync("content/queue.json", "utf8"));
          const p = JSON.parse(fs.readFileSync("config/products.json", "utf8"));
          if (!Array.isArray(q.items) || q.publishingEnabled !== false) throw new Error("Queue must exist and publishing must remain disabled");
          const approved = new Set(p.products.filter(x => x.status === "approved").map(x => x.url));
          for (const item of q.items) if (!approved.has(item.productUrl)) throw new Error("Unapproved product URL in queue: " + item.id);
          console.log("PASS: " + q.items.length + " queue items; all product links approved; publishing disabled.");
          '
      - name: Prepare an isolated queue proposal
        run: |
          mkdir -p "$RUNNER_TEMP/queue-proposal"
          cp content/queue.json "$RUNNER_TEMP/queue-proposal/queue.json"
          cp "$RUNNER_TEMP/production-readiness.json" "$RUNNER_TEMP/queue-proposal/production-readiness.json"
      - name: Replenish draft topics in the isolated proposal only
        env:
          QUEUE_PATH: ${{ runner.temp }}/queue-proposal/queue.json
        run: node scripts/replenish-queue.mjs
      - name: Retain queue proposal for operator review
        uses: actions/upload-artifact@v4
        with:
          name: sonicvhibez-queue-proposal-${{ github.run_id }}
          path: ${{ runner.temp }}/queue-proposal/
          if-no-files-found: error
          retention-days: 14
      - name: Report non-mutating workflow boundary
        run: |
          {
            echo "## Queue readiness and proposal"
            echo "- Existing repository queue was validated read-only."
            echo "- Replenishment ran against an isolated temporary copy."
            echo "- A queue proposal artifact was retained for operator review."
            echo "- This workflow has contents: read and cannot push or modify main."
            echo "- No rendering, upload, scheduling or publication was performed."
          } >> "$GITHUB_STEP_SUMMARY"
