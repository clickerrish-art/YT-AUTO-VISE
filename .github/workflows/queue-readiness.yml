name: Queue readiness
on:
  push:
    branches: [main]
    paths:
      - "scripts/replenish-queue.mjs"
      - "scripts/production-readiness.mjs"
      - "tests/**"
      - "scripts/render-short.mjs"
      - "package.json"
      - "README.md"
      - "content/queue.json"
      - "content/*.srt"
      - "content/*.md"
      - "content/*.json"
      - ".github/workflows/queue-readiness.yml"
  workflow_dispatch:
  schedule:
    # Operational queue-readiness/replenishment check only; it does not publish. Runs Tue/Thu/Sat UTC cron while content draft slots remain Tue/Sat with a 72-hour minimum.
    - cron: "0 15 * * 2,4,6"
permissions:
  contents: write
jobs:
  validate-and-replenish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install production dependencies for regression tests
        run: npm install --ignore-scripts
      - name: Check JavaScript syntax
        run: |
          node --check scripts/replenish-queue.mjs
          node --check scripts/check-content.mjs
          node --check scripts/check-captions.mjs
          node --check scripts/preflight-media.mjs
          node --check scripts/render-short.mjs
          node --check scripts/production-readiness.mjs
          node --check scripts/upload-private.mjs
      - name: Run repository regression tests
        run: node --test
      - name: Report production blockers without publishing
        run: node scripts/production-readiness.mjs
      - name: Validate existing caption files
        run: node scripts/check-captions.mjs content/short-001-wildlife-video-storytelling.srt content/short-002-plan-wildlife-documentary.srt
      - name: Validate queue and approved product URLs
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          const q = JSON.parse(fs.readFileSync("content/queue.json", "utf8"));
          const p = JSON.parse(fs.readFileSync("config/products.json", "utf8"));
          if (!Array.isArray(q.items) || q.publishingEnabled !== false) throw new Error("Queue must exist and publishing must remain disabled");
          const approved = new Set(p.products.filter(x => x.status === "approved").map(x => x.url));
          for (const item of q.items) if (!approved.has(item.productUrl)) throw new Error("Unapproved product URL in queue: " + item.id);
          console.log("PASS: " + q.items.length + " queue items; all product links approved; publishing disabled.");
          '
      - name: Replenish draft topic queue
        run: node scripts/replenish-queue.mjs
      - name: Commit queue only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/queue.json
          if git diff --cached --quiet; then
            echo "Queue already contains all seed topics."
          else
            git commit -m "chore: replenish reviewed-topic queue"
            git push origin HEAD:main
          fi
