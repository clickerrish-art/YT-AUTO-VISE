name: Generate owner-acknowledged non-commercial Edge TTS auditions (not production)

on:
  workflow_dispatch:
    inputs:
      allow_noncommercial_audition:
        description: Explicitly acknowledge this is an unapproved Edge TTS internal audition only, not commercial production narration.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sonicvhibez-long-form-narration
  cancel-in-progress: false

jobs:
  generate:
    if: ${{ inputs.allow_noncommercial_audition == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require explicit non-commercial audition acknowledgement
        env:
          ALLOW_NONCOMMERCIAL_AUDITION: ${{ inputs.allow_noncommercial_audition }}
        run: |
          if [ "$ALLOW_NONCOMMERCIAL_AUDITION" != "true" ]; then
            echo "::error::Blocked. Edge TTS is not the approved Roderic voice and is not commercially cleared."
            exit 1
          fi
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install narration client and media probe
        run: python -m pip install --disable-pip-version-check edge-tts mutagen
      - name: Generate non-commercial internal audition drafts
        run: python scripts/generate_long_form_narration.py --voice en-US-GuyNeural --allow-noncommercial-audition
      - name: Verify non-commercial audition manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("media/long-form-drafts/narration-audition-manifest.json").read_text(encoding="utf-8"))
          assert data["status"] == "INTERNAL_AUDITION_ONLY"
          assert data["voiceApprovalStatus"] == "NOT_OWNER_APPROVED"
          assert data["licenseStatus"] == "NON_COMMERCIAL_INTERNAL_EVALUATION_ONLY"
          assert data["commercialUseAllowed"] is False
          assert data["productionUseAllowed"] is False
          assert data["publishingEnabled"] is False
          print("PASS: audio is internal audition only; no production or publication is authorized.")
          PY
      - name: Set up Node for caption validation
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify audio files, text, captions and runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from mutagen.mp3 import MP3
          out = Path("media/long-form-drafts")
          expected = ["long-001-narration-draft.mp3", "long-002-narration-draft.mp3"]
          reports = []
          for filename in expected:
              audio = out / filename
              text_file = audio.with_suffix(".txt")
              caption_file = out / audio.name.replace("-narration-draft.mp3", "-captions-draft.srt")
              if not audio.is_file() or audio.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty audio: {audio}")
              if not text_file.is_file() or not text_file.read_text(encoding="utf-8").strip():
                  raise SystemExit(f"Missing narration text: {text_file}")
              if len(text_file.read_text(encoding="utf-8").split()) < 500:
                  raise SystemExit(f"Narration is under 500 words: {text_file}")
              if not caption_file.is_file() or not caption_file.read_text(encoding="utf-8").strip():
                  raise SystemExit(f"Missing captions: {caption_file}")
              seconds = float(MP3(str(audio)).info.length)
              reports.append({"file": filename, "durationSeconds": round(seconds, 3), "withinTarget": 360 <= seconds <= 600})
          (out / "duration-report.json").write_text(json.dumps(reports, indent=2) + "\n", encoding="utf-8")
          if not all(row["withinTarget"] for row in reports):
              raise SystemExit("One or more internal audition drafts are outside the 6–10 minute target.")
          print("PASS: both internal audition drafts meet the 6–10 minute runtime target.")
          PY
      - name: Validate caption timing structure
        run: node scripts/check-captions.mjs media/long-form-drafts/long-001-captions-draft.srt media/long-form-drafts/long-002-captions-draft.srt
      - name: Upload internal audition artifact only
        uses: actions/upload-artifact@v4
        with:
          name: sonicvhibez-long-form-internal-audition-only
          path: |
            media/long-form-drafts/*.mp3
            media/long-form-drafts/*.txt
            media/long-form-drafts/*.srt
            media/long-form-drafts/duration-report.json
            media/long-form-drafts/narration-audition-manifest.json
            content/long-form-scripts.md
          if-no-files-found: error
          retention-days: 7
