name: Acquire Pexels crocodile footage for documentary review

on:
  push:
    branches: [codex/marketing-machine-audit-fixes]
    paths:
      - ".github/workflows/acquire-crocodile-footage-review.yml"
      - "scripts/acquire-crocodile-footage-review.mjs"
      - "content/owner-media-policy-override-2026-11-22.json"
      - "content/media/pexels-license-evidence-2026-11-22.md"
  workflow_dispatch:
    inputs:
      review_only:
        description: Confirm that source acquisition is for internal review only and is not publication approval.
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: acquire-pexels-crocodile-review
  cancel-in-progress: true

jobs:
  acquire:
    name: Download, hash, probe and fully decode Pexels crocodile sources
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require review-only acknowledgement for manual runs
        if: github.event_name == 'workflow_dispatch'
        env:
          REVIEW_ONLY: ${{ inputs.review_only }}
        run: |
          if [ "$REVIEW_ONLY" != "true" ]; then
            echo "::error::This workflow acquires candidate media for review only; it never authorizes publication."
            exit 1
          fi
      - name: Check out exact source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify owner media policy and Pexels licence evidence
        run: |
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const policy = JSON.parse(fs.readFileSync("content/owner-media-policy-override-2026-11-22.json", "utf8"));
          if (policy.status !== "ACTIVE_WITH_ASSET_LEVEL_REVIEW_GATES" ||
              policy.mediaRules.pexelsLicensedStockAllowed !== true ||
              policy.mediaRules.aiGeneratedWildlifeVisualsAllowed !== false ||
              policy.releaseGates.publicOrUnattendedPublishingRemainsDisabled !== true) {
            throw new Error("Owner media policy is missing or unsafe.");
          }
          if (!fs.existsSync("content/media/pexels-license-evidence-2026-11-22.md")) {
            throw new Error("Pexels licence evidence is missing.");
          }
          console.log("PASS: Pexels sources may be acquired for review; final rights and publication gates remain closed.");
          NODE
      - name: Install pinned FFmpeg and ffprobe
        uses: AnimMouse/setup-ffmpeg@178e0b4a408f06ce40d896c3cd79f50fa6f8b0c3
        with:
          version: "9.0"
          token: ${{ github.token }}
      - name: Check acquisition script syntax
        run: node --check scripts/acquire-crocodile-footage-review.mjs
      - name: Acquire and verify source MP4 files
        run: node scripts/acquire-crocodile-footage-review.mjs
      - name: Upload exact source media and acquisition evidence for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sonicvhibez-long-form-001-pexels-crocodile-review
          path: artifacts/long-form-001/pexels-candidates/
          if-no-files-found: error
          retention-days: 14
