name: Live Cloudflare staging HTTP smoke

on:
  push:
    branches: [codex/cloudflare-adapter-integration-20261108]
    paths:
      - ".github/workflows/staging-http-smoke.yml"
      - "cloudflare/**"
      - "public/**"
      - "wrangler.jsonc"

permissions:
  contents: read

jobs:
  staging-http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STAGING_BASE_URL: https://sonicvhibez-durable-state-staging.kajiboye44.workers.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Verify staging dashboard is protected by Cloudflare Access
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";

          const base = process.env.STAGING_BASE_URL;
          for (const route of ["/", "/dashboard", "/operational-readyz", "/readyz"]) {
            const response = await fetch(base + route, { redirect: "manual", signal: AbortSignal.timeout(20000) });
            const location = response.headers.get("location");
            assert.ok([301, 302, 303, 307, 308].includes(response.status), route + " must be intercepted by the staging Access policy");
            assert.ok(location, route + " must provide an Access login redirect");
            const login = new URL(location, base);
            assert.ok(login.hostname.endsWith(".cloudflareaccess.com"), route + " must redirect only to the configured Cloudflare Access identity service");
            assert.ok(login.pathname.includes("/cdn-cgi/access/login/"), route + " must use the Cloudflare Access login flow");
            console.log(JSON.stringify({ route, status: response.status, accessProtected: true, loginHost: login.hostname }));
          }
          console.log("Unauthenticated staging requests are consistently gated by Cloudflare Access; no dashboard or readiness route is exposed anonymously.");
          NODE
