name: Check SonicVhibez production readiness

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/production-readiness.mjs"
      - "tests/production-readiness.test.mjs"
      - ".github/workflows/production-readiness.yml"
      - "content/**"
      - "config/weekly-content-plan.json"
  workflow_dispatch:
  schedule:
    # Weekly diagnostic only; does not upload or publish.
    - cron: "0 16 * * 1"
  push:
    branches: [main]
    paths:
      - "content/queue.json"
      - "content/next-short.json"
      - "content/render-manifest.example.json"
      - "scripts/production-readiness.mjs"
      - ".github/workflows/production-readiness.yml"

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Report blockers without exposing credentials
        id: readiness
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SONICVHIBEZ_CHANNEL_ID: ${{ secrets.SONICVHIBEZ_CHANNEL_ID }}
        run: |
          mkdir -p readiness-report
          set +e
          node scripts/production-readiness.mjs 2>&1 | tee readiness-report/readiness.txt
          readiness_status=${PIPESTATUS[0]}
          node scripts/production-readiness.mjs --json > readiness-report/readiness.json 2> readiness-report/readiness-json-error.txt
          json_status=$?
          set -e
          printf '%s\n%s\n' "$readiness_status" "$json_status" > readiness-report/exit-codes.txt
          echo "Observed readiness exit codes: human=$readiness_status json=$json_status"
          echo "exit_code=$readiness_status" >> "$GITHUB_OUTPUT"
          echo "json_exit_code=$json_status" >> "$GITHUB_OUTPUT"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const names = ['YOUTUBE_CLIENT_ID','YOUTUBE_CLIENT_SECRET','YOUTUBE_REFRESH_TOKEN','SONICVHIBEZ_CHANNEL_ID'];
          const report = Object.fromEntries(names.map(name => [name, process.env[name] ? 'configured' : 'missing']));
          fs.writeFileSync('readiness-report/secret-presence.json', JSON.stringify(report, null, 2) + '\\n');
          NODE
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonicvhibez-readiness-report
          path: readiness-report/
          retention-days: 30

      - name: Fail the workflow when mandatory readiness gates are blocked
        if: always()
        run: |
          if [ ! -s readiness-report/exit-codes.txt ]; then
            echo "Readiness exit-code evidence is missing; refusing to infer a result."
            exit 1
          fi
          readiness_status=$(sed -n '1p' readiness-report/exit-codes.txt)
          json_status=$(sed -n '2p' readiness-report/exit-codes.txt)
          case "$readiness_status:$json_status" in
            *[!0-9:]*|:*) echo "Readiness exit-code evidence is malformed."; exit 1 ;;
          esac
          echo "Verifying readiness exit codes from retained evidence: human=$readiness_status json=$json_status"
          if [ "$readiness_status" -ne "$json_status" ]; then
            echo "Human-readable and JSON readiness checks disagree or JSON generation failed."
            exit 1
          fi
          if [ "$readiness_status" -ne 0 ]; then
            echo "Production readiness is BLOCKED. Review the retained diagnostic artifact; do not bypass the gates."
            exit 1
          fi
