name: Deploy SonicVhibez Cloudflare staging
# Intentional staging-only rollout: commit marker [deploy-staging] is required.

on:
  push:
    branches: [codex/cloudflare-adapter-integration-20261108]
    paths:
      - "cloudflare/**"
      - "public/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-staging.yml"

permissions:
  contents: read

jobs:
  deploy-staging:
    if: contains(github.event.head_commit.message, '[deploy-staging]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check deployment credential availability without exposing it
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment credential is configured."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not configured; staging deployment was safely skipped."
          fi

      - uses: actions/checkout@v7
        if: steps.credentials.outputs.available == 'true'

      - name: Upload dashboard shell to private R2
        if: steps.credentials.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: bba3ba6fc08653dc66349b5a313f518d
        run: |
          set -euo pipefail
          npx --yes wrangler@4 r2 object put sonicvhibez-artifacts-staging/dashboard/dashboard.html \
            --file public/dashboard.html \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-store" \
            --remote --force --config wrangler.jsonc
      - name: Deploy exact staging configuration
        if: steps.credentials.outputs.available == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: bba3ba6fc08653dc66349b5a313f518d
          wranglerVersion: "4"
          command: deploy --config wrangler.jsonc --keep-vars

      - name: Verify operational staging readiness and held publication gate
        if: steps.credentials.outputs.available == 'true'
        env:
          BASE_URL: https://sonicvhibez-durable-state-staging.kajiboye44.workers.dev
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if curl --fail --silent --show-error "$BASE_URL/operational-readyz" -o /tmp/operational-readyz.json; then
              break
            fi
            if [[ "$attempt" -eq 10 ]]; then
              echo "Staging operational readiness endpoint did not become ready."
              exit 1
            fi
            sleep 3
          done
          node -e 'const fs=require("node:fs");const r=JSON.parse(fs.readFileSync("/tmp/operational-readyz.json","utf8"));if(r.ready!==true||r.publishingEnabled!==false||r.blockers?.length)throw new Error(JSON.stringify(r));'
          curl --fail --silent --show-error "$BASE_URL/" -o /tmp/dashboard.html
          grep -qi "SonicVhibez" /tmp/dashboard.html
          code="$(curl --silent --show-error -o /tmp/production-readyz.json -w "%{http_code}" "$BASE_URL/readyz")"
          test "$code" = "503"
          node -e 'const fs=require("node:fs");const r=JSON.parse(fs.readFileSync("/tmp/production-readyz.json","utf8"));if(r.ready!==false||r.publishingEnabled!==false)throw new Error(JSON.stringify(r));'
          echo "Operational staging, private dashboard hosting, and production publication hold verified."
